<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#121212" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dice Roller</title>
    <meta name="description" content="Roll completely customizable virtual dice, choose colors, set custom values, icons, and share your dice presets instantly!">

    <!-- Open Graph / Discord / Facebook (scrapers require absolute image URLs) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://customdiceroller.com/" />
    <meta property="og:title" content="Dice Roller - Customizable Virtual Dice" />
    <meta property="og:description" content="Roll completely customizable virtual dice, choose colors, set custom values, icons, and share your dice presets instantly!" />
    <meta property="og:image" content="https://customdiceroller.com/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Dice Roller - Customizable Virtual Dice" />
    <meta property="twitter:description" content="Roll completely customizable virtual dice, choose colors, set custom values, icons, and share your dice presets instantly!" />
    <meta property="twitter:image" content="https://customdiceroller.com/og-image.jpg" />
    <link rel="canonical" href="https://customdiceroller.com/" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Google Analytics (GA4) — honors the in-app telemetry toggle and skips localhost -->
    <script>
      (function () {
        var GA_ID = 'G-LF0JH7CVP6';
        var isDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        var optedOut = false;
        try { optedOut = localStorage.getItem('telemetryEnabled') === 'false'; } catch (e) { /* private mode */ }
        // Official GA4 kill switch: drops ALL hits, including automatic page_views
        window['ga-disable-' + GA_ID] = isDev || optedOut;

        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { dataLayer.push(arguments); };
        gtag('js', new Date());
        gtag('config', GA_ID);

        if (!isDev) {
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
          document.head.appendChild(s);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          // Unregister any active service worker on localhost to clean up cached dev state
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (let registration of registrations) {
              registration.unregister();
            }
          });
          // Also clear cache storage to ensure fresh asset fetching
          if ('caches' in window) {
            caches.keys().then((names) => {
              for (let name of names) caches.delete(name);
            });
          }
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .catch(err => console.log('Service Worker registration failed:', err));
          });
        }
      }
    </script>
  </body>
</html>
