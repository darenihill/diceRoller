<!DOCTYPE html>
<html>

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description"
                content="A web app for rolling customizable virtual dice with various faces and colors">
        <meta name="keywords"
                content="dice, roll, dice roller, custom dice, dice colors, custom faces, virtual, virtual dice">
        <title>Dice Roller</title>
        <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
        <link rel="stylesheet" type="text/css" href="style/rollerStyle.css">
</head>

<body>

        <body>
                <div class="left-menu">
                        <button type="button" class="double-wide-button" id="donate">
                                <i class="fas fa-coffee"></i>
                                Donate
                        </button>
                        <button type="button" class="double-wide-button" id="suggestions-btn">
                                <i class="fas fa-lightbulb"></i>
                                Feedback
                        </button>
                        <button type="button" class="double-wide-button" id="help-btn">
                                <i class="fas fa-question-circle"></i>
                                Help
                        </button>
                        <button type="button" class="double-wide-button" id="roll-history-btn">
                                <i class="fas fa-history"></i>
                                History
                              </button>
                        <button type="button" class="double-wide-button" id="presets-btn">
                                <i class="fas fa-list"></i>
                                Presets
                        </button>
                        <button type="button" class="double-wide-button" id="delete-all-btn">
                                <i class="fa-solid fa-trash"></i>
                                All
                        </button>
                        <button type="button" class="double-wide-button" id="save-btn">
                                <i class="fas fa-save"></i>
                                Save
                        </button>
                        <button type="button" class="double-wide-button" id="load-btn">
                                <i class="fas fa-upload"></i>
                                Load
                        </button>

                </div>
                <div class="dice-container-wrapper">
                        <div id="dice-container"></div>
                </div>
                <footer>
                        <div class="left-footer-container">
                                <button id="toggle-menu" type="button">
                                        <div class="icon">
                                                <i class="fas fa-chevron-up"></i>
                                        </div>
                                </button>
                        </div>
                        </button>
                        </div>

                        <div class="primary-buttons-container">
                                <button type="button" id="all-dice-status" class="update-hold-status-button">
                                        <div class="icon">
                                                <i class="fa-solid fa-lock"></i>
                                        </div>
                                </button>
                                <button type="button" class="add-button" onclick="addDice()">
                                        <div class="icon">
                                                <i class="fa-solid fa-plus"></i>
                                        </div>
                                </button>
                                <button type="button" class="roll-button" onclick="rollDice()">
                                        <div class="icon">
                                                <i class="fa-solid fa-dice-six"></i>
                                        </div>
                                        <div class="roll-label">Roll</div>
                                </button>
                </footer>





                <script src="https://kit.fontawesome.com/a2463f3d5f.js" crossorigin="anonymous"></script>
                <script src="script/rollerScript.js"></script>
        </body>

</html>
